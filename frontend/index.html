<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Couchbase Onboarding Agent</title>
    <script>
      // Apply the saved theme (or the OS preference) before first paint.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("cb-onboarding-theme") || "system"; } catch (e) {}
        var light = pref === "light" ||
          (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
