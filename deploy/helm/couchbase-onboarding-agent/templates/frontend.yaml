apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coa.fullname" . }}-frontend
  labels:
    {{- include "coa.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "coa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "coa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "coa.image" (list . .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          env:
            - name: BACKEND_URL
              value: {{ printf "http://%s:%v" (include "coa.backendService" .) .Values.backend.service.port | quote }}
            - name: TLS_ENABLED
              value: {{ .Values.frontend.tls.enabled | quote }}
            {{- if .Values.frontend.tls.enabled }}
            - name: HTTPS_PORT
              value: {{ include "coa.frontendHttpsPort" . | quote }}
            - name: TLS_HOSTNAME
              value: {{ concat .Values.frontend.tls.hostnames .Values.frontend.tls.ipAddresses | join "," | default "localhost" | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.frontend.tls.enabled }}
            - name: https
              containerPort: 8443
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if .Values.frontend.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
          {{- end }}
      {{- if .Values.frontend.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "coa.frontendTlsSecret" . }}
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
      {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coa.frontendService" . }}
  labels:
    {{- include "coa.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "coa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    {{- if .Values.frontend.tls.enabled }}
    - name: https
      port: {{ .Values.frontend.service.port }}
      targetPort: https
    - name: http
      port: {{ .Values.frontend.service.httpPort }}
      targetPort: http
    {{- else }}
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
    {{- end }}
