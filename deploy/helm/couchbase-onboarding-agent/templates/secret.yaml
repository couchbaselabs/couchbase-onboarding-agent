{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coa.fullname" . }}-secrets
  labels:
    {{- include "coa.labels" . | nindent 4 }}
  annotations:
    # Keep generated secrets (and the credential encryption key) if the release is uninstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  API_AUTH_TOKEN: {{ include "coa.secretValue" (list . "API_AUTH_TOKEN" .Values.secrets.apiAuthToken "token") | b64enc | quote }}
  STATE_ENCRYPTION_KEY: {{ include "coa.secretValue" (list . "STATE_ENCRYPTION_KEY" .Values.secrets.stateEncryptionKey "fernet") | b64enc | quote }}
  {{- if .Values.memory.bundled.enabled }}
  MEMORY_CB_PASSWORD: {{ include "coa.secretValue" (list . "MEMORY_CB_PASSWORD" .Values.memory.password "token") | b64enc | quote }}
  {{- else }}
  MEMORY_CB_PASSWORD: {{ required "memory.password is required when memory.bundled.enabled=false" .Values.memory.password | b64enc | quote }}
  {{- end }}
  CAPELLA_API_TOKEN: {{ .Values.secrets.capellaApiToken | default "" | b64enc | quote }}
{{- end }}
