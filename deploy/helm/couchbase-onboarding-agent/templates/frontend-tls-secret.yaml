{{- if and .Values.frontend.tls.enabled (not .Values.frontend.tls.existingSecret) }}
{{- $name := printf "%s-frontend-tls" (include "coa.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "coa.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    # Keep the generated certificate across upgrades and uninstalls so browsers
    # that trusted it keep working. Delete the Secret to rotate it.
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
{{- if and $existing (hasKey $existing.data "tls.crt") (hasKey $existing.data "tls.key") }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $dns := concat (list "localhost") .Values.frontend.tls.hostnames | uniq }}
{{- $ips := concat (list "127.0.0.1") .Values.frontend.tls.ipAddresses | uniq }}
{{- $cn := default (first $ips) (first .Values.frontend.tls.hostnames) }}
{{- $cert := genSelfSignedCert $cn $ips $dns (int .Values.frontend.tls.days) }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
