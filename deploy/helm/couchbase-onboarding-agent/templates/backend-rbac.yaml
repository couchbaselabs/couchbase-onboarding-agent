{{- if include "coa.tlsManagedByApp" . }}
# Lets the backend publish a certificate uploaded under Settings -> Certificates
# into the frontend's TLS Secret -- that one Secret, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coa.backendServiceAccount" . }}
  labels:
    {{- include "coa.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coa.backendServiceAccount" . }}-tls
  labels:
    {{- include "coa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "coa.frontendTlsSecret" . | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "coa.backendServiceAccount" . }}-tls
  labels:
    {{- include "coa.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "coa.backendServiceAccount" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "coa.backendServiceAccount" . }}-tls
{{- end }}
