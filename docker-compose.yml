# Local evaluation stack: UI + API + local LLM + the agent's own memory store.
# Your source databases and destination Couchbase cluster/Capella project are
# external and configured per migration in the UI -- nothing about them lives here.
#
# Every published port binds to 127.0.0.1. To reach the UI from another machine,
# set API_AUTH_TOKEN in .env and change the frontend port mapping deliberately.
# For shared or production use, see deploy/helm/.
name: couchbase-onboarding-agent

services:
  # -- Agent memory: Couchbase Enterprise Edition with Vector Search --------
  # NOT the migration destination: the assistant's long-term memory (past
  # validations, decisions, bottleneck findings).
  #
  # Licensing: the couchbase:enterprise image is free for development, testing
  # and evaluation under Couchbase's Enterprise Free license and converts to a
  # paid subscription in production -- see https://www.couchbase.com/legal/agreements/.
  # For production, point MEMORY_CB_* at a cluster you're licensed for (or
  # Capella) instead of running this container.
  couchbase-memory:
    image: couchbase:enterprise-7.6.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091-8096:8091-8096"
      - "127.0.0.1:11210-11211:11210-11211"
    volumes:
      - couchbase_memory_data:/opt/couchbase/var
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/pools"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [coa-net]

  # One-shot bootstrap of the memory bucket/scope/collection/indexes. Retries
  # itself if it loses the race with Couchbase's own startup.
  memory-init:
    build:
      context: .
      dockerfile: scripts/Dockerfile.init
    depends_on:
      couchbase-memory:
        condition: service_healthy
    environment:
      MEMORY_CB_HOST: couchbase-memory
      MEMORY_CB_USERNAME: ${MEMORY_CB_USERNAME:-Administrator}
      MEMORY_CB_PASSWORD: ${MEMORY_CB_PASSWORD:?Set MEMORY_CB_PASSWORD in .env (see env.example)}
      MEMORY_CB_BUCKET: ${MEMORY_CB_BUCKET:-agent_memory}
      MEMORY_CB_SCOPE: ${MEMORY_CB_SCOPE:-agent}
      MEMORY_CB_COLLECTION: ${MEMORY_CB_COLLECTION:-episodes}
    networks: [coa-net]
    restart: on-failure:5

  # -- Local LLM: Qwen 3, served via an Ollama-compatible API ----------------
  # CPU by default. For an NVIDIA GPU on Linux:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
  qwen-service:
    build: ./qwen-service
    restart: unless-stopped
    environment:
      QWEN_MODEL: ${QWEN_MODEL_NAME:-qwen3:8b}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [coa-net]
    healthcheck:
      # Healthy only once the model is pulled (first boot downloads ~5 GB), so the
      # chat panel doesn't come up before the model can answer.
      test: ["CMD-SHELL", "ollama list | grep -q \"$${QWEN_MODEL}\""]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 20s

  # -- API + migration engine ------------------------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MEMORY_CB_CONNECTION_STRING: couchbase://couchbase-memory
      MEMORY_CB_PASSWORD: ${MEMORY_CB_PASSWORD:?Set MEMORY_CB_PASSWORD in .env (see env.example)}
      QWEN_BASE_URL: http://qwen-service:11434
    volumes:
      # Encrypted migration records, checkpoints and the generated state key.
      - state_data:/data/state
      - scratch_data:/data/scratch
      # cbbackupmgr archives for Couchbase-to-Couchbase migrations (one per migration).
      - cbbackupmgr_archives:/data/cbbackupmgr-archives
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      couchbase-memory:
        condition: service_healthy
      qwen-service:
        condition: service_healthy
    networks: [coa-net]

  # -- UI (nginx: static files + /api and /ws proxied to the backend) ---------
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - backend
    networks: [coa-net]

networks:
  coa-net:
    driver: bridge

volumes:
  couchbase_memory_data:
  ollama_data:
  state_data:
  scratch_data:
  cbbackupmgr_archives:
