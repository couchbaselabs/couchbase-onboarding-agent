# Local evaluation stack: UI + API + local LLM + the agent's own memory store.
# Your source databases and destination Couchbase cluster/Capella project are
# external and configured per migration in the UI -- nothing about them lives here.
#
# Every published port binds to 127.0.0.1. To reach the UI from another machine,
# set API_AUTH_TOKEN in .env and change the frontend port mapping deliberately.
# For shared or production use, see deploy/helm/.
name: couchbase-onboarding-agent

services:
  # -- Agent memory: Couchbase Enterprise Edition with Vector Search --------
  # NOT the migration destination: the assistant's long-term memory (past
  # validations, decisions, bottleneck findings).
  #
  # Licensing: the couchbase:enterprise image is free for development, testing
  # and evaluation under Couchbase's Enterprise Free license and converts to a
  # paid subscription in production -- see https://www.couchbase.com/legal/agreements/.
  # For production, point MEMORY_CB_* at a cluster you're licensed for (or
  # Capella) instead of running this container.
  couchbase-memory:
    image: couchbase:enterprise-7.6.2
    restart: unless-stopped
    # Vendor image with its own privilege needs: block privilege escalation but
    # keep its default capability set (see SECURITY_HARDENING.md).
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8091-8096:8091-8096"
      - "127.0.0.1:11210-11211:11210-11211"
    volumes:
      - couchbase_memory_data:/opt/couchbase/var
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:8091/pools"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [coa-net]

  # One-shot bootstrap of the memory bucket/scope/collection/indexes. Retries
  # itself if it loses the race with Couchbase's own startup.
  memory-init:
    build:
      context: .
      dockerfile: scripts/Dockerfile.init
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      couchbase-memory:
        condition: service_healthy
    environment:
      MEMORY_CB_HOST: couchbase-memory
      MEMORY_CB_USERNAME: ${MEMORY_CB_USERNAME:-Administrator}
      MEMORY_CB_PASSWORD: ${MEMORY_CB_PASSWORD:?Set MEMORY_CB_PASSWORD in .env (see env.example)}
      MEMORY_CB_BUCKET: ${MEMORY_CB_BUCKET:-agent_memory}
      MEMORY_CB_SCOPE: ${MEMORY_CB_SCOPE:-agent}
      MEMORY_CB_COLLECTION: ${MEMORY_CB_COLLECTION:-episodes}
      MEMORY_EMBEDDING_DIMS: ${MEMORY_EMBEDDING_DIMS:-768}
    networks: [coa-net]
    restart: on-failure:5

  # -- Local LLM: Qwen 3, served via an Ollama-compatible API ----------------
  # Optional. Only built and started when the "llm" profile is active, which
  # .env does with COMPOSE_PROFILES=llm (the default in env.example). To run
  # without the assistant -- no model download, ~3 GB less RAM -- set
  # COMPOSE_PROFILES= (empty) and LLM_ENABLED=false in .env before building.
  # CPU by default. `./scripts/compose.sh up` detects a GPU and adds the right
  # override (docker-compose.gpu.yml for NVIDIA, docker-compose.rocm.yml for AMD,
  # docker-compose.host-llm.yml for Apple Silicon via a host Ollama); or pass
  # one with -f by hand. The container logs "LLM compute: GPU|CPU" at startup.
  qwen-service:
    profiles: [llm]
    build: ./qwen-service
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      QWEN_MODEL: ${QWEN_MODEL_NAME:-qwen3:4b}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL_NAME:-nomic-embed-text}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [coa-net]
    healthcheck:
      # Healthy only once both models are pulled (first boot downloads ~3 GB), so
      # the chat panel doesn't come up before the model can answer.
      test: ["CMD-SHELL", "ollama list | grep -q \"$${QWEN_MODEL}\" && ollama list | grep -q \"$${QWEN_EMBEDDING_MODEL}\""]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 20s

  # -- API + migration engine ------------------------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Starts as root only to fix volume ownership, then drops to uid 10001
    # (entrypoint.sh); these are the capabilities that step needs, nothing else.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    env_file:
      - path: .env
        required: false
    environment:
      MEMORY_CB_CONNECTION_STRING: couchbase://couchbase-memory
      MEMORY_CB_PASSWORD: ${MEMORY_CB_PASSWORD:?Set MEMORY_CB_PASSWORD in .env (see env.example)}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      QWEN_BASE_URL: http://qwen-service:11434
      QWEN_MODEL_NAME: ${QWEN_MODEL_NAME:-qwen3:4b}
      QWEN_EMBEDDING_MODEL_NAME: ${QWEN_EMBEDDING_MODEL_NAME:-nomic-embed-text}
      MEMORY_EMBEDDING_DIMS: ${MEMORY_EMBEDDING_DIMS:-768}
      # Where a UI certificate uploaded under Settings -> Certificates goes
      # (the frontend's tls volume, mounted here too); nginx reloads it.
      TLS_PUBLISH_DIR: /data/tls
    volumes:
      # Encrypted migration records, checkpoints and the generated state key.
      - state_data:/data/state
      - scratch_data:/data/scratch
      - frontend_tls:/data/tls
      # cbbackupmgr archives for Couchbase-to-Couchbase migrations (one per migration).
      - cbbackupmgr_archives:/data/cbbackupmgr-archives
    ports:
      - "127.0.0.1:8000:8000"
    # Start as soon as the memory store is up, without waiting for it to be
    # healthy: migrations don't need it. The LLM container is deliberately not a
    # dependency -- it's optional (see the "llm" profile above), and the UI shows
    # the assistant as "waiting" until its model is ready when it is enabled.
    depends_on:
      couchbase-memory:
        condition: service_started
    networks: [coa-net]

  # -- UI (nginx: static files + /api and /ws proxied to the backend) ---------
  frontend:
    build: ./frontend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]   # nginx-unprivileged listens on 8080; nothing needs a capability
    environment:
      BACKEND_URL: http://backend:8000
      # HTTPS by default: nginx terminates TLS on 8443 with the certificate in
      # /etc/nginx/tls (self-signed, generated on first start for TLS_HOSTNAME,
      # kept in the frontend_tls volume). Put your own server.crt/server.key
      # into certs/tls/ and uncomment the bind mount below to use them.
      # HTTPS_PORT is the published port, so the http->https redirect works.
      TLS_ENABLED: ${TLS_ENABLED:-true}
      TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
      HTTPS_PORT: ${UI_PORT:-5173}
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:8443"
      - "127.0.0.1:${UI_HTTP_PORT:-5174}:8080"   # redirects to https://localhost:${UI_PORT}
    volumes:
      - frontend_tls:/etc/nginx/tls
      # - ./certs/tls:/etc/nginx/tls:ro
    depends_on:
      - backend
    networks: [coa-net]

networks:
  coa-net:
    driver: bridge

volumes:
  frontend_tls:
  couchbase_memory_data:
  ollama_data:
  state_data:
  scratch_data:
  cbbackupmgr_archives:
