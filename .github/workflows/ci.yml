name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deploy/helm/couchbase-onboarding-agent
      - name: Render (defaults and production-style values)
        run: |
          helm template t deploy/helm/couchbase-onboarding-agent > /tmp/default.yaml
          helm template t deploy/helm/couchbase-onboarding-agent \
            --set memory.bundled.enabled=false \
            --set memory.external.connectionString=couchbases://cb.example.com \
            --set memory.password=x \
            --set llm.externalUrl=http://ollama:11434 \
            --set ingress.enabled=true > /tmp/prod.yaml
      - name: Validate manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary /tmp/default.yaml /tmp/prod.yaml

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
      - name: Build memory-init image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile.init
          push: false
